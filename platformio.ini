; HRT-Sim: firmware de imitacion del HRT Monitor SIN sensor fisico.
; Mismos pines (include/pinout.h), display/teclado via HRT-libs,
; audio I2S al MAX98357A, voz Opus (.bop) desde LittleFS y BLE (NimBLE)
; para intercambio con la app movil.
;
; Pasos:
;   pio run -e esp32dev                 -> compila
;   pio run -e esp32dev -t upload       -> flashea app (COM4)
;   pio run -e esp32dev -t uploadfs     -> sube LittleFS (audios data/v/*)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
lib_ldf_mode = deep+
lib_extra_dirs = ${PROJECT_DIR}/HRT-libs
build_src_filter = +<*> -<keytest_main.cpp> -<keytest_lib_main.cpp>
lib_deps =
  h2zero/NimBLE-Arduino@^2.5.2
  sh123/esp32_opus@^1.0.3
build_flags =
  -Iinclude

; Teclado AISLADO (solo HRT_KEYPAD, sin BLE/I2S/PPG/display): mismo codigo que
; examples/Basic de HRT-libs, validado en hardware. Sirve para separar
; "hardware+driver" del resto del firmware cuando el teclado no responde.
; Flashear: pio run -e keytest -t upload --upload-port COM4
[env:keytest]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_ldf_mode = deep+
lib_extra_dirs = ${PROJECT_DIR}/HRT-libs
build_src_filter = +<keytest_main.cpp>
build_flags =
  -Iinclude

; TEST OFICIAL de la libreria: copia literal de
; HRT-libs/HRT_KEYPAD/examples/Basic/Basic.ino (sin modificaciones).
; Flashear: pio run -e keytest_lib -t upload --upload-port COM4
[env:keytest_lib]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_ldf_mode = deep+
lib_extra_dirs = ${PROJECT_DIR}/HRT-libs
build_src_filter = +<keytest_lib_main.cpp>
build_flags =
  -Iinclude
